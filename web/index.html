<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
        />

        <!-- PWA Meta Tags -->
        <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
        <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)" />
        <meta name="description" content="AI-powered development assistant" />

        <!-- iOS PWA Meta Tags -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="apple-mobile-web-app-title" content="HOPI" />
        <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

        <!-- Favicon -->
        <link rel="icon" href="/favicon.ico" sizes="48x48" />
        <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />

        <!-- Safari Pinned Tab -->
        <link rel="mask-icon" href="/mask-icon.svg" color="#111827" />

        <!-- Prevent flash of white background on dark mode -->
        <style>
            html { background: #fff }
            @media (prefers-color-scheme: dark) {
                html { background: #1c1c1e; color-scheme: dark }
            }

            :root {
                --boot-loader-bg: rgba(255, 255, 255, 0.95);
                --boot-loader-fg: #374151;
                --boot-loader-border: rgba(0, 0, 0, 0.10);
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --boot-loader-bg: rgba(31, 41, 55, 0.95);
                    --boot-loader-fg: #e5e7eb;
                    --boot-loader-border: rgba(255, 255, 255, 0.12);
                }
            }
            #boot-loader {
                position: fixed;
                right: calc(16px + env(safe-area-inset-right));
                bottom: calc(16px + env(safe-area-inset-bottom));
                z-index: 9999;
                pointer-events: none;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                padding: 8px 10px;
                border-radius: 9999px;
                border: 1px solid var(--boot-loader-border);
                background: var(--boot-loader-bg);
                color: var(--boot-loader-fg);
                backdrop-filter: blur(6px);
                -webkit-backdrop-filter: blur(6px);
                box-shadow: 0 10px 22px rgba(0, 0, 0, 0.16);
                font: 500 13px/1.2 system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
            }
            #boot-loader .spinner {
                width: 14px;
                height: 14px;
                border-radius: 9999px;
                border: 2px solid currentColor;
                border-top-color: transparent;
                animation: boot-spin 1s linear infinite;
                opacity: 0.9;
            }
            @keyframes boot-spin {
                from { transform: rotate(0deg); }
                to { transform: rotate(360deg); }
            }
        </style>
        <script>
            (function () {
                try {
                    var raw = localStorage.getItem('hopi-font-scale')
                    var scale = Number(raw)
                    if (scale === 0.8 || scale === 0.9 || scale === 1 || scale === 1.1 || scale === 1.2) {
                        document.documentElement.style.setProperty('--app-font-scale', String(scale))
                    }
                } catch (error) {
                    // Ignore storage errors.
                }
            })()
        </script>
        <script>
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark')
            }
        </script>

        <title>HOPI</title>
    </head>
    <body>
        <div id="root">
            <div id="boot-loader" role="status" aria-live="polite">
                <div class="spinner"></div>
                <div class="label">Loading…</div>
            </div>
        </div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
