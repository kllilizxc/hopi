<svg width="1280" height="760" viewBox="0 0 1280 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HOPI Goal system architecture</title>
  <desc id="desc">A diagram showing a goal-native Kanban control plane, local durable docs, a deterministic scheduler, specialized agents, runtime overlay, and web or phone supervision surfaces.</desc>
  <rect width="1280" height="760" rx="28" fill="#F7F7F2"/>
  <rect x="34" y="34" width="1212" height="692" rx="24" fill="#FFFFFF" stroke="#D8D8CF" stroke-width="2"/>

  <text x="72" y="89" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="700">HOPI Goal: executable Kanban for multi-agent development</text>
  <text x="72" y="123" fill="#555550" font-family="Inter, Arial, sans-serif" font-size="17">Durable workflow truth lives in repo files. Runtime systems only annotate, execute, and synchronize.</text>

  <rect x="72" y="172" width="276" height="372" rx="16" fill="#F3F5EC" stroke="#C9D1B4" stroke-width="2"/>
  <text x="100" y="212" fill="#182018" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Goal Docs</text>
  <text x="100" y="242" fill="#4C5840" font-family="Inter, Arial, sans-serif" font-size="15">repo-local source of truth</text>

  <rect x="100" y="274" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#C9D1B4"/>
  <text x="122" y="302" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">goal.md</text>
  <text x="196" y="302" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">objective</text>

  <rect x="100" y="332" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#C9D1B4"/>
  <text x="122" y="360" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">design.md</text>
  <text x="213" y="360" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">rationale</text>

  <rect x="100" y="390" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#C9D1B4"/>
  <text x="122" y="418" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">todo.yml</text>
  <text x="205" y="418" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">Kanban truth</text>

  <rect x="100" y="448" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#C9D1B4"/>
  <text x="122" y="476" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">decisions.yml</text>
  <text x="233" y="476" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">blockers</text>

  <rect x="100" y="506" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#C9D1B4"/>
  <text x="122" y="534" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">events.jsonl</text>
  <text x="231" y="534" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">audit trail</text>

  <rect x="402" y="172" width="476" height="372" rx="16" fill="#EEF6F8" stroke="#B7CDD5" stroke-width="2"/>
  <text x="430" y="212" fill="#102025" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Deterministic Control Plane</text>
  <text x="430" y="242" fill="#40565E" font-family="Inter, Arial, sans-serif" font-size="15">reads docs, derives eligibility, starts only legal work</text>

  <rect x="430" y="274" width="420" height="76" rx="12" fill="#FFFFFF" stroke="#B7CDD5"/>
  <text x="454" y="304" fill="#222" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700">Scheduler / Reconciler</text>
  <text x="454" y="328" fill="#666" font-family="Inter, Arial, sans-serif" font-size="14">dependencies, lane capacity, decisions, runner availability</text>

  <rect x="430" y="380" width="118" height="54" rx="12" fill="#FFFFFF" stroke="#B7CDD5"/>
  <text x="458" y="413" fill="#222" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Planner</text>

  <rect x="561" y="380" width="118" height="54" rx="12" fill="#FFFFFF" stroke="#B7CDD5"/>
  <text x="584" y="413" fill="#222" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Generator</text>

  <rect x="692" y="380" width="118" height="54" rx="12" fill="#FFFFFF" stroke="#B7CDD5"/>
  <text x="720" y="413" fill="#222" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Reviewer</text>

  <rect x="492" y="456" width="118" height="54" rx="12" fill="#FFFFFF" stroke="#B7CDD5"/>
  <text x="524" y="489" fill="#222" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Merger</text>

  <rect x="624" y="456" width="118" height="54" rx="12" fill="#FFFFFF" stroke="#B7CDD5"/>
  <text x="663" y="489" fill="#222" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Radar</text>

  <rect x="932" y="172" width="276" height="372" rx="16" fill="#F8F1EA" stroke="#D9C4AD" stroke-width="2"/>
  <text x="960" y="212" fill="#22170E" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">Runtime Overlay</text>
  <text x="960" y="242" fill="#5F4D3F" font-family="Inter, Arial, sans-serif" font-size="15">live state, not workflow truth</text>

  <rect x="960" y="274" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#D9C4AD"/>
  <text x="982" y="302" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">sessions</text>
  <text x="1064" y="302" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">messages</text>

  <rect x="960" y="332" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#D9C4AD"/>
  <text x="982" y="360" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">attempts</text>
  <text x="1068" y="360" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">failures</text>

  <rect x="960" y="390" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#D9C4AD"/>
  <text x="982" y="418" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">permissions</text>
  <text x="1088" y="418" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">approvals</text>

  <rect x="960" y="448" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#D9C4AD"/>
  <text x="982" y="476" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">runners</text>
  <text x="1054" y="476" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">machine state</text>

  <rect x="960" y="506" width="220" height="44" rx="10" fill="#FFFFFF" stroke="#D9C4AD"/>
  <text x="982" y="534" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600">SSE / RPC</text>
  <text x="1074" y="534" fill="#6B6B62" font-family="Inter, Arial, sans-serif" font-size="14">sync</text>

  <rect x="72" y="604" width="292" height="78" rx="16" fill="#F6F3FA" stroke="#D0C4DD" stroke-width="2"/>
  <text x="100" y="636" fill="#21162B" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Web / PWA / Telegram</text>
  <text x="100" y="662" fill="#5A5061" font-family="Inter, Arial, sans-serif" font-size="14">Goal board, approvals, chat, terminal, files</text>

  <rect x="494" y="604" width="292" height="78" rx="16" fill="#F3F5EC" stroke="#C9D1B4" stroke-width="2"/>
  <text x="522" y="636" fill="#182018" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Goal Assistant</text>
  <text x="522" y="662" fill="#4C5840" font-family="Inter, Arial, sans-serif" font-size="14">Explains blockers and routes decisions</text>

  <rect x="916" y="604" width="292" height="78" rx="16" fill="#EEF6F8" stroke="#B7CDD5" stroke-width="2"/>
  <text x="944" y="636" fill="#102025" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Native Agent Sessions</text>
  <text x="944" y="662" fill="#40565E" font-family="Inter, Arial, sans-serif" font-size="14">Claude Code, Codex, Gemini, OpenCode</text>

