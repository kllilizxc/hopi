<svg width="1280" height="620" viewBox="0 0 1280 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Session runtime and remote control flow</title>
  <desc id="desc">Diagram showing local native agent sessions connected through the HOPI CLI and hub to web, PWA, and Telegram control surfaces, with runtime overlay stored separately from durable workflow state.</desc>
  <rect width="1280" height="620" rx="28" fill="#F8F7F1"/>
  <text x="64" y="72" fill="#171717" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="700">Each native session stays local, but becomes remotely operable</text>
  <text x="64" y="106" fill="#5B5B55" font-family="Inter, Arial, sans-serif" font-size="17">HOPI wraps official agent CLIs, streams runtime state to the hub, and exposes approvals, terminal, files, and messages remotely.</text>

  <rect x="74" y="158" width="316" height="338" rx="22" fill="#EEF6F8" stroke="#B8CDD5" stroke-width="2"/>
  <text x="110" y="199" fill="#10242A" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Local Machine</text>
  <rect x="110" y="232" width="244" height="64" rx="14" fill="#FFFFFF" stroke="#B8CDD5"/>
  <text x="136" y="260" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Official agent CLI</text>
  <text x="136" y="282" fill="#666" font-family="Inter, Arial, sans-serif" font-size="14">Claude / Codex / Gemini</text>
  <rect x="110" y="322" width="244" height="64" rx="14" fill="#FFFFFF" stroke="#B8CDD5"/>
  <text x="136" y="350" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">HOPI CLI wrapper</text>
  <text x="136" y="372" fill="#666" font-family="Inter, Arial, sans-serif" font-size="14">messages, tools, permissions</text>
  <rect x="110" y="412" width="244" height="52" rx="14" fill="#FFFFFF" stroke="#B8CDD5"/>
  <text x="136" y="444" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Runner daemon</text>

  <rect x="482" y="158" width="316" height="338" rx="22" fill="#F4F2EA" stroke="#CEC8B8" stroke-width="2"/>
  <text x="518" y="199" fill="#211A10" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">HOPI Hub</text>
  <rect x="518" y="232" width="244" height="56" rx="14" fill="#FFFFFF" stroke="#CEC8B8"/>
  <text x="544" y="267" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Socket.IO session channel</text>
  <rect x="518" y="310" width="244" height="56" rx="14" fill="#FFFFFF" stroke="#CEC8B8"/>
  <text x="544" y="345" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">HTTP API + SSE fan-out</text>
  <rect x="518" y="388" width="244" height="68" rx="14" fill="#FFFFFF" stroke="#CEC8B8"/>
  <text x="544" y="416" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">SQLite runtime overlay</text>
  <text x="544" y="438" fill="#666" font-family="Inter, Arial, sans-serif" font-size="14">messages, attempts, approvals</text>

  <rect x="890" y="158" width="316" height="338" rx="22" fill="#F4F0F8" stroke="#CCBFD9" stroke-width="2"/>
  <text x="926" y="199" fill="#21162A" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700">Remote Surfaces</text>
  <rect x="926" y="232" width="244" height="56" rx="14" fill="#FFFFFF" stroke="#CCBFD9"/>
  <text x="952" y="267" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Web / PWA</text>
  <rect x="926" y="310" width="244" height="56" rx="14" fill="#FFFFFF" stroke="#CCBFD9"/>
  <text x="952" y="345" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Telegram Mini App</text>
  <rect x="926" y="388" width="244" height="68" rx="14" fill="#FFFFFF" stroke="#CCBFD9"/>
  <text x="952" y="416" fill="#222" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Approvals + terminal</text>
  <text x="952" y="438" fill="#666" font-family="Inter, Arial, sans-serif" font-size="14">files, git diff, messages</text>

  <path d="M390 327H482" stroke="#6E7B81" stroke-width="4" stroke-linecap="round"/>
  <path d="M798 327H890" stroke="#6E5981" stroke-width="4" stroke-linecap="round"/>
  <text x="411" y="306" fill="#555550" font-family="Inter, Arial, sans-serif" font-size="14">agent events</text>
  <text x="820" y="306" fill="#555550" font-family="Inter, Arial, sans-serif" font-size="14">live control</text>

  <rect x="342" y="530" width="596" height="54" rx="16" fill="#FFFFFF" stroke="#DADAD2"/>
  <text x="374" y="563" fill="#333" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">Session state is runtime overlay; Goal Kanban remains durable repo-local truth.</text>
</svg>
